# Rafraîchit data/data.json depuis l'API Google Ads et le commite.
#
# Optionnel — inactif tant que les secrets ne sont pas renseignés.
# Settings → Secrets and variables → Actions → New repository secret :
#   GOOGLE_ADS_DEVELOPER_TOKEN
#   GOOGLE_ADS_CLIENT_ID
#   GOOGLE_ADS_CLIENT_SECRET
#   GOOGLE_ADS_REFRESH_TOKEN
#   GOOGLE_ADS_LOGIN_CUSTOMER_ID

name: Rafraîchir les données Google Ads

on:
  schedule:
    # 05:30 UTC — les données Google Ads de la veille sont alors consolidées.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours à récupérer"
        required: false
        default: '180'

permissions:
  contents: write

concurrency:
  # Deux rafraîchissements simultanés se marcheraient sur les pieds au push.
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sans secrets, le job s'abstient au lieu d'échouer : un workflow planifié
      # qui échoue enverrait un mail d'échec par jour jusqu'à leur ajout.
      - name: Vérifier que les secrets sont présents
        id: check
        env:
          TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Secrets Google Ads absents — rafraîchissement ignoré. Voir le README, section 3.4."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer les performances
        if: steps.check.outputs.ready == 'true'
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python scripts/fetch_ads_data.py --days "${{ github.event.inputs.days || '180' }}"

      # Jeu de données distinct, fenêtre propre de 90 jours. « continue-on-error »
      # parce qu'un échec ici ne doit pas priver le rapport de sa mise à jour
      # principale : la section AI Max se masque d'elle-même si le fichier manque.
      - name: Récupérer les données AI Max
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python scripts/fetch_aimax.py --days 90 --max-terms 4000

      # Même fenêtre que le rapport principal : cette section partage son filtre
      # de période. Même clause « continue-on-error » : la section se masque
      # plutôt que de faire échouer le rafraîchissement.
      - name: Récupérer les performances par sexe
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python scripts/fetch_gender.py --days "${{ github.event.inputs.days || '180' }}"

      # Signaux de santé du tracking. Le journal des changements Google Ads
      # qu'il embarque est plafonné à 28 jours par l'API : un rafraîchissement
      # quotidien est donc la seule façon d'en garder une trace continue.
      - name: Récupérer les signaux de tracking
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python scripts/fetch_tracking.py --days "${{ github.event.inputs.days || '180' }}"

      # A/B tests. Les métriques des bras ne sont collectées que sur la fenêtre
      # des tests eux-mêmes, donc le volume reste faible.
      - name: Récupérer les expériences
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python scripts/fetch_experiments.py

      # Historique des modifications Google Ads. Le rafraîchissement quotidien
      # n'est pas un confort : l'API ne conserve que 28 jours, donc ce qui n'est
      # pas collecté aujourd'hui est perdu pour de bon.
      - name: Récupérer l'historique des modifications
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python scripts/fetch_change_history.py

      # Timeline des changements techniques, depuis un Google Sheet publié.
      # Sans le secret CHANGELOG_SHEET_ID, l'étape ne fait rien : l'onglet
      # Tracking fonctionne sans, il n'affiche simplement aucun repère.
      # Le garde est dans le shell et non dans « if: » : le contexte env d'une
      # étape n'est pas lisible depuis sa propre condition.
      - name: Récupérer la timeline des changements
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          SHEET: ${{ secrets.CHANGELOG_SHEET_ID }}
          GID: ${{ secrets.CHANGELOG_SHEET_GID }}
        run: |
          if [ -z "$SHEET" ]; then
            echo "::notice::Secret CHANGELOG_SHEET_ID absent — timeline ignorée. L'onglet Tracking fonctionne sans."
            exit 0
          fi
          if [ -n "$GID" ]; then
            python scripts/fetch_changelog.py --sheet "$SHEET" --gid "$GID"
          else
            python scripts/fetch_changelog.py --sheet "$SHEET"
          fi

      - name: Commiter si les données ont changé
        if: steps.check.outputs.ready == 'true'
        run: |
          # Seuls les fichiers réellement présents : « git add » sur un chemin
          # absent échoue, et un jeu de données optionnel a le droit de manquer.
          FILES=""
          for f in data/data.json data/aimax.json data/gender.json \
                   data/tracking.json data/changelog.json data/changes.json \
                   data/releases.json data/experiments.json; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          if [ -z "$FILES" ]; then
            echo "Aucun fichier de données à commiter."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # « -f » est délibéré : changelog.json et aimax.json sont gitignorés
          # pour qu'aucun « git add . » depuis un poste ne publie un jeu
          # d'exemple ou des requêtes de recherche par accident. Ici le contenu
          # ne peut venir que du Sheet et de l'API, d'où l'exception assumée.
          git add -f $FILES
          # --cached : le contrôle porte sur l'index, sinon un fichier
          # nouvellement créé passerait pour « aucun changement ».
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Mise à jour automatique des données Google Ads"
          git push

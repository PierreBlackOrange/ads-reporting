# Rafraîchit data/data.json depuis l'API Google Ads et le commite.
#
# Optionnel — inactif tant que les secrets ne sont pas renseignés.
# Settings → Secrets and variables → Actions → New repository secret :
#   GOOGLE_ADS_DEVELOPER_TOKEN
#   GOOGLE_ADS_CLIENT_ID
#   GOOGLE_ADS_CLIENT_SECRET
#   GOOGLE_ADS_REFRESH_TOKEN
#   GOOGLE_ADS_LOGIN_CUSTOMER_ID

name: Rafraîchir les données Google Ads

on:
  schedule:
    # 05:30 UTC — les données Google Ads de la veille sont alors consolidées.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours à récupérer"
        required: false
        default: '180'

permissions:
  contents: write

concurrency:
  # Deux rafraîchissements simultanés se marcheraient sur les pieds au push.
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier que les secrets sont présents
        env:
          TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secrets Google Ads absents — voir le README, section 3.4."
            exit 1
          fi

      - name: Récupérer les performances
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python scripts/fetch_ads_data.py --days "${{ github.event.inputs.days || '180' }}"

      - name: Commiter si les données ont changé
        run: |
          if git diff --quiet -- data/data.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "Mise à jour automatique des données Google Ads"
          git push
